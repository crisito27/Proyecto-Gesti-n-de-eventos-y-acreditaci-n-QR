name: Compilar APK AcreditaQR Android

on:
  push:
    branches:
      - feature/mobile-configuracion-servidor-apk
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_USE_PRECOMPILED_MODULES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci
      - name: Probar URL configurable
        working-directory: mobile
        run: npm test
      - name: Generar proyecto Android
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compilar APK de instalación
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AcreditaQR-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
