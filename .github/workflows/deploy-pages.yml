name: Deploy React app to GitHub Pages (source master)

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'assets/**'
      - 'index.html'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: taller2-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taller2-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
          VITE_DEMO_MODE: ${{ vars.VITE_API_URL == '' && 'true' || 'false' }}
        run: npm run build

      - name: Publicar React en la raíz de master (GitHub Pages)
        working-directory: .
        run: |
          # Se actualizan únicamente los archivos públicos; el código fuente
          # del backend, los tests y los documentos se conservan.
          touch taller2-react/dist/.nojekyll
          cp -R taller2-react/dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg icons.svg .nojekyll assets
          if git diff --cached --quiet; then
            echo "El sitio está actualizado."
          else
            git commit -m "chore(pages): publica React compilado [skip ci]"
            git push origin HEAD:master
          fi
